[project]
name = "orchestration"
version = "0.1.0"
description = "Dockerfile generator for LLM Code Solver — auto-detects language, version, and build system from any GitHub repo"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
